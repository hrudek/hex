# Hex+ (fork-only) CI for the iPhone app.
#   push hex-plus       → iOS changed? tests, archive, TestFlight upload (automatic)
#   push sync/upstream  → the daily upstream merge: checks; hexplus-gate promotes it when green
#   push upstream-pr/*  → an unmerged upstream PR taken over by hexplus-upstream-pr: checks, scope
#   pull_request        → feature PRs: checks, scope, labels, iOS tests and archive
# Bot branches (sync/upstream, upstream-pr/*) get their PR checks from their push runs.
#   workflow_dispatch   → any of the above by hand; ad-hoc from hex-plus or feature/*
name: Hex+ CI
run-name: "Hex+ CI · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.number) || github.ref_name }} · ${{ inputs.distribution || github.event.action || github.event_name }}"

on:
  push:
    branches: [hex-plus, sync/upstream, "upstream-pr/**"]
  pull_request:
    branches: [hex-plus]
    # As OpenCode's checks: no label events (after adding "infra", re-run the failed check);
    # drafts get only the Linux checks until marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      distribution:
        description: unsigned builds only; ad-hoc (hex-plus or feature/*) and testflight (hex-plus) also sign
        type: choice
        options: [unsigned, ad-hoc, testflight]
        default: unsigned
        required: true
      only_testing:
        description: "Comma-separated -only-testing targets (empty: every test, none: skip tests)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: hexplus-ci-${{ github.event_name }}-${{ github.ref }}-${{ inputs.distribution || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/sync/upstream' }}

jobs:
  linux:
    name: Linux checks
    if: ${{ !(github.head_ref == 'sync/upstream' || startsWith(github.head_ref, 'upstream-pr/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Hex+ script tests
        run: python3 -m unittest discover -s .github/hexplus/tests -v
      - name: Shell syntax
        run: for script in .github/hexplus/*.sh; do bash -n "$script"; done
      - name: Lint Hex+ workflows
        # SC2016/SC2129: Markdown backticks in single quotes and one-line-per-fact outputs are intended.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -color -ignore SC2016 -ignore SC2129 .github/workflows/hexplus-*.yml
      - name: No conflict markers
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base=$BASE
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" == 0000000000000000000000000000000000000000 ]] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null || [[ "$GITHUB_REF" != refs/heads/hex-plus && -z "${{ github.event.pull_request.number }}" ]]; then
            base=$(git rev-parse origin/hex-plus)
          fi
          if git diff "$base" "$HEAD" | grep -nE '^\+(<<<<<<<|>>>>>>>)( |$)|^\+=======$'; then
            echo 'Unresolved merge conflict markers (lines above).'; exit 1
          fi
          echo "No conflict markers between ${base:0:8} and ${HEAD:0:8}."
      - name: Scope (what this change may touch)
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/upstream-pr/')
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          base=${BASE:-$(git rev-parse origin/hex-plus)}
          bash .github/hexplus/scope.sh "$base" "$HEAD"

  labels:
    name: Label PR
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
      && !startsWith(github.head_ref, 'upstream-pr/') && github.head_ref != 'sync/upstream'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.number }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: Label by branch and author
        run: |
          case "$HEAD_REF" in
            feature/*) gh pr edit "$PR" --add-label feature ;;
          esac
          if gh api "repos/$GH_REPO/pulls/$PR/commits" --jq '.[].author.login // empty' | grep -qx 'claude\[bot\]'; then
            gh pr edit "$PR" --add-label agent
          fi

  decide:
    name: Decide
    if: ${{ !(github.head_ref == 'sync/upstream' || startsWith(github.head_ref, 'upstream-pr/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      sign: ${{ steps.decide.outputs.sign }}
      config: ${{ steps.config.outputs.config }}
    steps:
      - name: Require configuration
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ARTIFACT_AGE_RECIPIENT: ${{ vars.ARTIFACT_AGE_RECIPIENT }}
        run: |
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo 'Set repository variable APPLE_TEAM_ID'; exit 1; }
          [[ "$ARTIFACT_AGE_RECIPIENT" =~ ^age1[0-9a-z]{58}$ ]] || { echo 'Set repository variable ARTIFACT_AGE_RECIPIENT'; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/hexplus
          persist-credentials: false
      - name: Load Hex+ identity
        id: config
        run: python3 .github/hexplus/config.py
      - name: Did anything the iOS build reads change, and what gets signed?
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DISTRIBUTION: ${{ inputs.distribution }}
          REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          base='' head=$AFTER sign=''
          case "$EVENT" in
            push)
              if [[ "$REF" == refs/heads/hex-plus ]]; then
                [[ "$BEFORE" != "$zero" ]] && base=$BEFORE
                sign=testflight
              else
                base=$(git ls-remote "$REPO" refs/heads/hex-plus | cut -f1)
              fi ;;
            pull_request) base=$PR_BASE head=$PR_HEAD ;;
            workflow_dispatch)
              case "$DISTRIBUTION" in
                unsigned) ;;
                ad-hoc) [[ "$REF" == refs/heads/hex-plus || "$REF" == refs/heads/feature/* ]] \
                          || { echo 'Ad-hoc signing only from hex-plus or feature/*'; exit 1; }
                        sign=ad-hoc ;;
                testflight) [[ "$REF" == refs/heads/hex-plus ]] || { echo 'TestFlight only from hex-plus'; exit 1; }
                            sign=testflight ;;
              esac ;;
          esac
          run=true
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            git init -q "$RUNNER_TEMP/fp"
            if git -C "$RUNNER_TEMP/fp" fetch -q --depth=1 --filter=blob:none "$REPO" "$base" "$head"; then
              a=$(bash .github/hexplus/fingerprint.sh "$RUNNER_TEMP/fp" "$base")
              b=$(bash .github/hexplus/fingerprint.sh "$RUNNER_TEMP/fp" "$head")
              diff <(echo "$a") <(echo "$b") || true
              [[ "$a" != "$b" ]] || run=false
            fi
          fi
          [[ "$run" == true ]] || sign=''
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          {
            echo '### Hex+ CI'
            echo "| | |"; echo "|---|---|"
            echo "| Commit | \`${head:0:8}\` |"
            echo "| Compared with | \`${base:0:8}\` |"
            echo "| iOS inputs changed | $run |"
            echo "| Signs | ${sign:-nothing} |"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Simulator tests
    needs: decide
    if: needs.decide.outputs.run == 'true' && inputs.only_testing != 'none' && !github.event.pull_request.draft
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 60
    env:
      APP_CONFIG: ${{ needs.decide.outputs.config }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select and verify Xcode
        env:
          XCODE_PATH: ${{ vars.XCODE_PATH }}
        run: bash .github/hexplus/select-xcode.sh
      - name: Run unit tests on the simulator
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: bash .github/hexplus/test.sh
      - name: Upload test log and result bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hexplus-tests-${{ github.run_id }}
          path: ${{ runner.temp }}/test-output
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Unsigned archive
    needs: decide
    if: needs.decide.outputs.run == 'true' && !github.event.pull_request.draft
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 90
    env:
      CI: "true"
      APP_CONFIG: ${{ needs.decide.outputs.config }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ARTIFACT_AGE_RECIPIENT: ${{ vars.ARTIFACT_AGE_RECIPIENT }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned artifact encryption tool
        run: bash .github/hexplus/install-age.sh
      - name: Select and verify Xcode
        env:
          XCODE_PATH: ${{ vars.XCODE_PATH }}
        run: bash .github/hexplus/select-xcode.sh
      - name: Build unsigned device archive (app, keyboard and widgets)
        run: bash .github/hexplus/build.sh
      - name: Upload encrypted archive and public provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hexplus-unsigned-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/output/archive.zip.age
            ${{ runner.temp }}/output/build.json
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign (${{ needs.decide.outputs.sign }})
    needs: [decide, test, build]
    # Automatic TestFlight needs green tests; a by-hand run may skip them on purpose.
    if: >-
      always() && needs.decide.outputs.sign != '' && needs.build.result == 'success'
      && (needs.test.result == 'success'
          || (needs.test.result == 'skipped' && github.event_name == 'workflow_dispatch'))
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 30
    environment: hexplus-${{ needs.decide.outputs.sign }}
    env:
      APP_CONFIG: ${{ needs.decide.outputs.config }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      DISTRIBUTION: ${{ needs.decide.outputs.sign }}
      ARTIFACT_AGE_RECIPIENT: ${{ vars.ARTIFACT_AGE_RECIPIENT }}
    steps:
      # Only Hex+'s own scripts; no source build runs on this runner.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/hexplus
          persist-credentials: false
      - name: Install pinned artifact encryption tool
        run: bash .github/hexplus/install-age.sh
      - name: Select and verify Xcode
        env:
          XCODE_PATH: ${{ vars.XCODE_PATH }}
        run: bash .github/hexplus/select-xcode.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hexplus-unsigned-${{ github.run_id }}
          path: ${{ runner.temp }}/input
      - name: Decrypt archive with environment-protected identity
        env:
          ARTIFACT_AGE_IDENTITY: ${{ secrets.ARTIFACT_AGE_IDENTITY }}
        run: bash .github/hexplus/decrypt-artifact.sh "$RUNNER_TEMP/input/archive.zip.age" "$RUNNER_TEMP/input/archive.zip"
      - name: Sign and export IPA
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILES_ZIP_BASE64: ${{ secrets.IOS_PROFILES_ZIP_BASE64 }}
        run: |
          if ! bash .github/hexplus/sign.sh > "$RUNNER_TEMP/signing.log" 2>&1; then
            echo 'Signing failed. Download and decrypt the signing diagnostics.'
            exit 1
          fi
      - name: Encrypt installable IPA
        run: bash .github/hexplus/encrypt-ipa.sh
      - name: Upload encrypted IPA and public provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hexplus-${{ needs.decide.outputs.sign }}-${{ github.run_id }}
          path: ${{ runner.temp }}/encrypted-deliverables/
          if-no-files-found: error
          retention-days: 7
      - name: Upload to App Store Connect for TestFlight processing
        if: needs.decide.outputs.sign == 'testflight'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          if ! bash .github/hexplus/upload-testflight.sh > "$RUNNER_TEMP/testflight.log" 2>&1; then
            echo 'Upload failed. Download and decrypt the signing diagnostics.'
            exit 1
          fi
          echo "Uploaded build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT} to TestFlight." >> "$GITHUB_STEP_SUMMARY"
      - name: Encrypt signing diagnostics
        if: always()
        run: bash .github/hexplus/encrypt-signing-logs.sh
      - name: Upload encrypted signing diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hexplus-signing-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/signing-diagnostics.zip.age
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: bash .github/hexplus/cleanup-signing.sh
