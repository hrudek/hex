# Hex+ CI for the iPhone app.
# Fast lane: PRs run Linux checks and compile only. Simulator tests run after
# merging to hex-plus, beside the TestFlight build (no nightly run). Screenshots and
# pre-merge tests are opt-in via the manual simulator distribution.
#   push hex-plus       → app changed? archive → TestFlight at once; tests in parallel
#   pull_request        → feature/fix PRs: checks, scope, labels, archive (required); no simulator
#   workflow_dispatch   → simulator preview (tests + screenshots, no archive), or a device build
name: Hex+ CI
run-name: "Hex+ CI · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.number) || github.ref_name }} · ${{ inputs.distribution || github.event.action || github.event_name }}"

on:
  push:
    branches: [hex-plus]
  pull_request:
    branches: [hex-plus]
    # As OpenCode's checks: no label events, so a label never starts a macOS run. Adding
    # "infra" re-runs the failed jobs instead (hexplus-recheck.yml); Scope reads labels live.
    # drafts get only the Linux checks until marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      distribution:
        description: simulator runs tests/screenshots only; unsigned builds; ad-hoc and testflight also sign
        type: choice
        options: [unsigned, ad-hoc, testflight, simulator]
        default: unsigned
        required: true
      only_testing:
        description: "Comma-separated -only-testing targets (empty: every test, none: skip tests)"
        type: string
        default: ""
      scenes:
        description: "Extra screenshot scenes, comma-separated (manual simulator mode only)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: hexplus-ci-${{ github.event_name }}-${{ github.ref }}-${{ inputs.distribution || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read   # Scope reads the PR's current labels
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Hex+ script tests
        run: python3 -m unittest discover -s .github/hexplus/tests -v
      - name: Offline dictation log tests
        run: python3 -m unittest discover -s ios/tools/dictation_log/tests -v
      - name: Shell syntax
        run: for script in .github/hexplus/*.sh; do bash -n "$script"; done
      - name: Lint Hex+ workflows
        # SC2016/SC2129: Markdown backticks in single quotes and one-line-per-fact outputs are intended.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -color -ignore SC2016 -ignore SC2129 .github/workflows/hexplus-*.yml
      - name: Scope (what this change may touch)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          base=${BASE:-$(git rev-parse origin/hex-plus)}
          # The PR's labels now, not the event's: a re-run after adding "infra" must see it.
          LABELS=''
          if [[ -n "$PR" ]]; then
            LABELS=$(gh api "repos/$GH_REPO/pulls/$PR" --jq '[.labels[].name] | join(",")')
          fi
          export LABELS
          bash .github/hexplus/scope.sh "$base" "$HEAD"

  labels:
    name: Label PR
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.number }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: Label by branch
        run: |
          case "$HEAD_REF" in
            feature/*) gh pr edit "$PR" --add-label feature ;;
          esac

  decide:
    name: Decide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      sign: ${{ steps.decide.outputs.sign }}
      config: ${{ steps.config.outputs.config }}
    steps:
      - name: Require configuration
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ARTIFACT_AGE_RECIPIENT: ${{ vars.ARTIFACT_AGE_RECIPIENT }}
        run: |
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo 'Set repository variable APPLE_TEAM_ID'; exit 1; }
          [[ "$ARTIFACT_AGE_RECIPIENT" =~ ^age1[0-9a-z]{58}$ ]] || { echo 'Set repository variable ARTIFACT_AGE_RECIPIENT'; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/hexplus
          persist-credentials: false
      - name: Load Hex+ identity
        id: config
        run: python3 .github/hexplus/config.py
      - name: Did anything the iOS build reads change, and what gets signed?
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DISTRIBUTION: ${{ inputs.distribution }}
          REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          base='' head=$AFTER sign='' mode=pipeline
          case "$EVENT" in
            push)
              [[ "$BEFORE" != "$zero" ]] && base=$BEFORE
              sign=testflight
              mode=app ;;   # PR Linux checks validate pipeline changes; only app changes ship
            pull_request) base=$PR_BASE head=$PR_HEAD ;;
            workflow_dispatch)
              case "$DISTRIBUTION" in
                unsigned|simulator) ;;
                ad-hoc) [[ "$REF" == refs/heads/hex-plus || "$REF" == refs/heads/feature/* ]] \
                          || { echo 'Ad-hoc signing only from hex-plus or feature/*'; exit 1; }
                        sign=ad-hoc ;;
                testflight) [[ "$REF" == refs/heads/hex-plus ]] || { echo 'TestFlight only from hex-plus'; exit 1; }
                            sign=testflight ;;
              esac ;;
          esac
          run=true
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            git init -q "$RUNNER_TEMP/fp"
            if git -C "$RUNNER_TEMP/fp" fetch -q --depth=1 --filter=blob:none "$REPO" "$base" "$head"; then
              a=$(bash .github/hexplus/fingerprint.sh "$RUNNER_TEMP/fp" "$base" "$mode")
              b=$(bash .github/hexplus/fingerprint.sh "$RUNNER_TEMP/fp" "$head" "$mode")
              diff <(echo "$a") <(echo "$b") || true
              [[ "$a" != "$b" ]] || run=false
            fi
          fi
          [[ "$run" == true ]] || sign=''
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          {
            echo '### Hex+ CI'
            echo "| | |"; echo "|---|---|"
            echo "| Commit | \`${head:0:8}\` |"
            echo "| Compared with | \`${base:0:8}\` |"
            echo "| iOS inputs changed ($mode) | $run |"
            echo "| Signs | ${sign:-nothing} |"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Simulator tests
    needs: decide
    # No simulator allocation for PRs; manual branch runs remain available.
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref == 'refs/heads/hex-plus') && needs.decide.outputs.run == 'true' && inputs.only_testing != 'none'
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 60
    env:
      APP_CONFIG: ${{ needs.decide.outputs.config }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select and verify Xcode
        env:
          XCODE_PATH: ${{ vars.XCODE_PATH }}
        run: bash .github/hexplus/select-xcode.sh
      - name: Cache keys (Xcode, month)
        id: cache-keys
        run: |
          xcode=$(xcodebuild -version | awk 'NR==1{v=$2} NR==2{b=$3} END{print v "-" b}')
          echo "spm=hexplus-spm-$xcode-${{ hashFiles('ios/project.yml') }}" >> "$GITHUB_OUTPUT"
          # A new compilation cache each month, so it never grows without bound.
          echo "cas=hexplus-cas-test-${{ runner.arch }}-$xcode-$(date -u +%Y-%m)-" >> "$GITHUB_OUTPUT"
      - name: Restore Swift package checkouts
        id: spm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: ${{ steps.cache-keys.outputs.spm }}
      - name: Restore compilation cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/CompilationCache
          key: ${{ steps.cache-keys.outputs.cas }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.cache-keys.outputs.cas }}
      - name: Run unit tests on the simulator
        id: tests
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: bash .github/hexplus/test.sh
      - name: Screenshots of the app's scenes (same build, no second compile)
        if: github.event_name == 'workflow_dispatch' && inputs.distribution == 'simulator' && !cancelled() && steps.tests.outcome != 'skipped'
        continue-on-error: true
        env:
          SCENES: ${{ inputs.scenes }}
        run: bash .github/hexplus/screenshots.sh
      - name: Upload screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.distribution == 'simulator' && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hexplus-screenshots-${{ github.run_id }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload test log and result bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hexplus-tests-${{ github.run_id }}
          path: ${{ runner.temp }}/test-output
          if-no-files-found: ignore
          retention-days: 7
      # Saved from pushes, schedules and manual runs only, never from a PR, so a PR
      # cannot plant anything that a hex-plus (TestFlight) build later restores.
      - name: Save Swift package checkouts
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' && github.event_name != 'pull_request' && steps.spm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: ${{ steps.cache-keys.outputs.spm }}
      - name: Save compilation cache
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' && github.event_name != 'pull_request' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/CompilationCache
          key: ${{ steps.cache-keys.outputs.cas }}${{ github.run_id }}-${{ github.run_attempt }}


  build:
    name: Unsigned archive
    needs: decide
    if: needs.decide.outputs.run == 'true' && !github.event.pull_request.draft && inputs.distribution != 'simulator'
    runs-on: ${{ vars.MACOS_BUILD_RUNNER || 'macos-15-intel' }}
    timeout-minutes: 90
    env:
      CI: "true"
      APP_CONFIG: ${{ needs.decide.outputs.config }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ARTIFACT_AGE_RECIPIENT: ${{ vars.ARTIFACT_AGE_RECIPIENT }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned artifact encryption tool
        run: bash .github/hexplus/install-age.sh
      - name: Select and verify Xcode
        env:
          XCODE_PATH: ${{ vars.XCODE_PATH }}
        run: bash .github/hexplus/select-xcode.sh
      - name: Cache keys (Xcode, month)
        id: cache-keys
        run: |
          xcode=$(xcodebuild -version | awk 'NR==1{v=$2} NR==2{b=$3} END{print v "-" b}')
          echo "spm=hexplus-spm-$xcode-${{ hashFiles('ios/project.yml') }}" >> "$GITHUB_OUTPUT"
          # A new compilation cache each month, so it never grows without bound.
          echo "cas=hexplus-cas-archive-${{ runner.arch }}-$xcode-$(date -u +%Y-%m)-" >> "$GITHUB_OUTPUT"
      - name: Restore Swift package checkouts
        id: spm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: ${{ steps.cache-keys.outputs.spm }}
      - name: Restore compilation cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/CompilationCache
          key: ${{ steps.cache-keys.outputs.cas }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.cache-keys.outputs.cas }}
      - name: Build unsigned device archive (app, keyboard and widgets)
        id: archive
        run: bash .github/hexplus/build.sh
      # Saved from pushes, schedules and manual runs only, never from a PR, so a PR
      # cannot plant anything that a hex-plus (TestFlight) build later restores.
      - name: Save Swift package checkouts
        if: ${{ !cancelled() && steps.archive.outcome != 'skipped' && github.event_name != 'pull_request' && steps.spm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: ${{ steps.cache-keys.outputs.spm }}
      - name: Save compilation cache
        if: ${{ !cancelled() && steps.archive.outcome != 'skipped' && github.event_name != 'pull_request' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/CompilationCache
          key: ${{ steps.cache-keys.outputs.cas }}${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload encrypted archive and public provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hexplus-unsigned-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/output/archive.zip.age
            ${{ runner.temp }}/output/build.json
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign (${{ needs.decide.outputs.sign }})
    # Ships as soon as the archive compiled; the tests run in parallel. Red tests are fixed
    # locally afterwards through a normal PR (the status issue shows them).
    needs: [decide, build]
    if: needs.decide.outputs.sign != '' && needs.build.result == 'success'
    runs-on: ${{ vars.MACOS_BUILD_RUNNER || 'macos-15-intel' }}
    timeout-minutes: 30
    environment: hexplus-${{ needs.decide.outputs.sign }}
    env:
      APP_CONFIG: ${{ needs.decide.outputs.config }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      DISTRIBUTION: ${{ needs.decide.outputs.sign }}
      ARTIFACT_AGE_RECIPIENT: ${{ vars.ARTIFACT_AGE_RECIPIENT }}
    steps:
      # Only Hex+'s own scripts; no source build runs on this runner.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/hexplus
          persist-credentials: false
      - name: Install pinned artifact encryption tool
        run: bash .github/hexplus/install-age.sh
      - name: Select and verify Xcode
        env:
          XCODE_PATH: ${{ vars.XCODE_PATH }}
        run: bash .github/hexplus/select-xcode.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hexplus-unsigned-${{ github.run_id }}
          path: ${{ runner.temp }}/input
      - name: Decrypt archive with environment-protected identity
        env:
          ARTIFACT_AGE_IDENTITY: ${{ secrets.ARTIFACT_AGE_IDENTITY }}
        run: bash .github/hexplus/decrypt-artifact.sh "$RUNNER_TEMP/input/archive.zip.age" "$RUNNER_TEMP/input/archive.zip"
      - name: Sign and export IPA
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILES_ZIP_BASE64: ${{ secrets.IOS_PROFILES_ZIP_BASE64 }}
        run: |
          if ! bash .github/hexplus/sign.sh > "$RUNNER_TEMP/signing.log" 2>&1; then
            echo 'Signing failed. Download and decrypt the signing diagnostics.'
            exit 1
          fi
      - name: Encrypt installable IPA
        run: bash .github/hexplus/encrypt-ipa.sh
      - name: Upload encrypted IPA and public provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hexplus-${{ needs.decide.outputs.sign }}-${{ github.run_id }}
          path: ${{ runner.temp }}/encrypted-deliverables/
          if-no-files-found: error
          retention-days: 7
      - name: Upload to App Store Connect for TestFlight processing
        if: needs.decide.outputs.sign == 'testflight'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          if ! bash .github/hexplus/upload-testflight.sh > "$RUNNER_TEMP/testflight.log" 2>&1; then
            echo 'Upload failed. Download and decrypt the signing diagnostics.'
            exit 1
          fi
          echo "Uploaded build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT} to TestFlight." >> "$GITHUB_STEP_SUMMARY"
      - name: Encrypt signing diagnostics
        if: always()
        run: bash .github/hexplus/encrypt-signing-logs.sh
      - name: Upload encrypted signing diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hexplus-signing-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/signing-diagnostics.zip.age
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: bash .github/hexplus/cleanup-signing.sh

  status:
    name: Refresh status
    needs: [linux, decide, test, build, sign]
    # The status issue reports hex-plus; red runs are fixed locally.
    if: >-
      always() && !cancelled() && github.event_name == 'push'
      && github.ref == 'refs/heads/hex-plus'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Refresh the status issue
        run: gh workflow run hexplus-status.yml --ref hex-plus
