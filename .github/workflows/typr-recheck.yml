# Typr: the "infra" label approves a PR that changes Typr's own automation.
# Adding it re-runs that commit's failed Typr CI jobs, whose Scope step reads the labels
# live. Typr CI itself ignores label events, so no other label starts a macOS run.
# gh only: never checks out or runs PR code, so pull_request_target is safe here.
name: Typr infra recheck
run-name: "Typr infra recheck · PR #${{ github.event.pull_request.number }}"

on:
  pull_request_target:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: typr-infra-recheck-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  recheck:
    if: github.event.label.name == 'infra'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Re-run this commit's failed Typr CI jobs if Linux checks failed
        run: |
          query="repos/$GH_REPO/actions/workflows/typr-ci.yml/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=1"
          id=$(gh api "$query" --jq '.workflow_runs[0].id // empty')
          if [[ -z "$id" ]]; then
            echo "No Typr CI run for ${HEAD_SHA:0:8} yet; when it runs, Scope reads the label itself."
            exit 0
          fi
          # A run can be re-run only once it has completed (the PR archive takes a while).
          for _ in $(seq 1 140); do
            [[ $(gh api "repos/$GH_REPO/actions/runs/$id" --jq .status) == completed ]] && break
            sleep 30
          done
          read -r status conclusion < <(gh api "repos/$GH_REPO/actions/runs/$id" --jq '"\(.status) \(.conclusion)"')
          if [[ "$status" != completed ]]; then
            echo "::error::Typr CI run $id did not finish in time; re-run its failed jobs by hand."
            exit 1
          fi
          linux=$(gh api "repos/$GH_REPO/actions/runs/$id/jobs" --jq '.jobs[] | select(.name == "Linux checks") | .conclusion')
          if [[ "$conclusion" == failure && "$linux" == failure ]]; then
            gh run rerun "$id" --failed
            echo "Re-running the failed jobs of Typr CI run $id with the infra label."
          else
            echo "Typr CI run $id: $conclusion, Linux checks: ${linux:-none}; nothing to re-run."
          fi
