# Hex+ (fork-only): carry an unmerged anomalyco/hex PR in Hex+ before upstream merges it.
#   gh workflow run hexplus-upstream-pr.yml -R hrudek/hex -f pr=1234
# Merges the PR's head into upstream-pr/<n> (from hex-plus) and opens a PR to
# hex-plus, labelled upstream-pr. Merge that PR with a merge commit, not squash.
# Rerun to pick up a newer version of the upstream PR. On a conflict the merge is
# committed with markers and the PR is a draft labelled "conflict": comment
# "@claude resolve the merge conflicts in this PR". Runs only git and gh.
name: Hex+ upstream PR
run-name: "Hex+ upstream PR · anomalyco/hex#${{ inputs.pr }}"

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the anomalyco/hex pull request
        type: number
        required: true

permissions:
  contents: read

concurrency:
  group: hexplus-upstream-pr-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  carry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: hexplus-sync
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ inputs.pr }}
    steps:
      - name: Look up the upstream PR
        id: upstream
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]{1,6}$ ]] || { echo 'pr must be a number'; exit 1; }
          gh api "repos/anomalyco/hex/pulls/$PR" > "$RUNNER_TEMP/pr.json"
          state=$(jq -r 'if .merged_at then "merged" else .state end' "$RUNNER_TEMP/pr.json")
          if [[ "$state" != open ]]; then
            echo "anomalyco/hex#$PR is $state; nothing to carry (a merged PR arrives with the daily sync)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          jq -r '.title' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/title.txt"
          echo "head=$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hex-plus
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Merge it into upstream-pr/${{ inputs.pr }}
        id: merge
        env:
          HEAD_SHA: ${{ steps.upstream.outputs.head }}
        run: |
          set -euo pipefail
          git config user.name 'hexplus-upstream-pr'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch -q --filter=blob:none https://github.com/anomalyco/hex.git "pull/$PR/head"
          [[ "$(git rev-parse FETCH_HEAD)" == "$HEAD_SHA" ]] || { echo 'Upstream PR moved during the run; rerun'; exit 1; }
          title=$(cat "$RUNNER_TEMP/title.txt")
          base=$(git merge-base HEAD "$HEAD_SHA")
          protected=$(git diff --name-only "$base" "$HEAD_SHA" -- HEXPLUS.md .github/hexplus '.github/workflows/hexplus-*')
          [[ -z "$protected" ]] || { echo "The upstream PR touches files Hex+ owns:"; echo "$protected"; exit 1; }
          files=$(git diff --name-only "$base" "$HEAD_SHA")
          ios=$(grep -E '^(ios/|app/AppIcon\.icon/|tests/fixtures/vocabulary/audio/)' <<<"$files" || true)
          message="Upstream PR anomalyco/hex#$PR: $title"
          git switch -q -C "upstream-pr/$PR"
          conflicts=''
          if ! git merge --no-ff --no-edit -m "$message" "$HEAD_SHA" > "$RUNNER_TEMP/merge.log" 2>&1; then
            conflicts=$(git diff --name-only --diff-filter=U)
            [[ -n "$conflicts" ]] || { cat "$RUNNER_TEMP/merge.log"; exit 1; }
            git add -A
            git commit -q --no-edit -m "$message (CONFLICTS)" -m "Conflict markers left in:" -m "$conflicts"
          fi
          git push -q --force origin "HEAD:refs/heads/upstream-pr/$PR"
          {
            echo "Carries [anomalyco/hex#$PR](https://github.com/anomalyco/hex/pull/$PR) (\`${HEAD_SHA:0:8}\`) into Hex+ before upstream merges it."
            echo
            echo "- Files changed upstream: **$(wc -l <<<"$files" | tr -d ' ')**, in the iPhone app: **$(grep -c . <<<"$ios" || true)**"
            echo '- **Merge with "Create a merge commit"**, not squash, so the upstream commits stay recognisable.'
            echo '- When upstream merges its PR, the daily sync brings the same change and this carry dissolves; the sync PR reports the upstream state.'
            echo "- Newer upstream version: \`gh workflow run hexplus-upstream-pr.yml -R hrudek/hex -f pr=$PR\`"
            if [[ -n "$conflicts" ]]; then
              echo; echo '> [!WARNING]'
              echo '> Merge conflicts are committed with markers. Comment `@claude resolve the merge conflicts in this PR` (or fix them by hand); CI fails while markers remain.'
              echo; echo '```'; echo "$conflicts"; echo '```'
            fi
          } > "$RUNNER_TEMP/body.md"
          {
            echo "message=$message"
            echo "conflict=$([[ -n "$conflicts" ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the PR
        env:
          TITLE: ${{ steps.merge.outputs.message }}
          CONFLICT: ${{ steps.merge.outputs.conflict }}
        run: |
          set -euo pipefail
          number=$(gh pr list --head "upstream-pr/$PR" --base hex-plus --state open --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          else
            draft=(); [[ "$CONFLICT" == true ]] && draft=(--draft)
            gh pr create --head "upstream-pr/$PR" --base hex-plus --title "$TITLE" \
              --body-file "$RUNNER_TEMP/body.md" --label upstream-pr "${draft[@]}"
            number=$(gh pr list --head "upstream-pr/$PR" --base hex-plus --state open --json number --jq '.[0].number')
          fi
          if [[ "$CONFLICT" == true ]]; then
            gh pr edit "$number" --add-label conflict
          fi
          echo "PR: $GITHUB_SERVER_URL/$GH_REPO/pull/$number" | tee -a "$GITHUB_STEP_SUMMARY"
