# Typr: keep the pinned issue "Typr status" current.
# Dispatched after each hex-plus CI run, weekly for renewal warnings, or by hand.
# gh only; runs Typr's status.py from hex-plus, never branch code.
name: Typr status
run-name: "Typr status · ${{ github.event_name }}"

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typr-status
  cancel-in-progress: true

jobs:
  status:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/typr
          persist-credentials: false
      - name: Rewrite the status issue
        run: python3 -I .github/typr/status.py >> "$GITHUB_STEP_SUMMARY"
