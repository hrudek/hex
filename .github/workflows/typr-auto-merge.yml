# Trusted main workflow only; never check out or execute PR code.
name: Typr auto-merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review]

permissions: {}

concurrency:
  group: typr-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Enable squash auto-merge without bypassing required checks
        run: gh pr merge "$PR" --auto --squash --match-head-commit "$HEAD_SHA"
