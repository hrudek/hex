# Trusted main workflow only; never check out or execute PR code.
# Merge after the completed CI/review checks, then explicitly dispatch main CI:
# GITHUB_TOKEN pushes do not trigger workflows, but workflow_dispatch does.
name: Typr auto-merge

on:
  workflow_run:
    workflows: [Typr CI, Typr review]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: typr-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'pull_request_target') &&
      (github.event.workflow_run.path == '.github/workflows/typr-ci.yml' ||
       github.event.workflow_run.path == '.github/workflows/typr-review.yml')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          sparse-checkout: .github/typr
          persist-credentials: false
      - name: Merge only the checked PR commit and dispatch main CI
        run: python3 -I .github/typr/auto-merge.py
