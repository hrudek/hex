# Hex+ (fork-only): bring anomalyco/hex dev into hex-plus by merge, through a PR.
#   1. sync/upstream = hex-plus + merge of upstream dev (bot branch, rebuilt each run)
#   2. push it (SYNC_TOKEN, so Hex+ CI runs on it) and open/update the PR "Sync upstream"
#   3. hexplus-gate fast-forwards hex-plus to it once Hex+ CI is green
# On a conflict the merge is committed WITH conflict markers to sync/upstream and
# the PR is a draft labelled "conflict", resolved locally by the owner (with Pi).
# While that PR is labelled "conflict", or carries commits pushed on top of the sync's
# own merge (a local fix), syncs leave it alone.
# This job only runs git and gh; it never builds or runs repository code,
# because it holds SYNC_TOKEN.
name: Hex+ sync upstream
run-name: "Hex+ sync · ${{ github.event_name }}"

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hexplus-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: hexplus-sync
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      # gh would otherwise pick the "upstream" remote (anomalyco/hex) as its repository.
      GH_REPO: ${{ github.repository }}
      UPSTREAM: https://github.com/anomalyco/hex.git
      UPSTREAM_BRANCH: dev
      SYNC_BRANCH: sync/upstream
    steps:
      - name: Require sync token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: test -n "$SYNC_TOKEN" || { echo 'Add secret SYNC_TOKEN to environment hexplus-sync'; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hex-plus
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Merge upstream into sync/upstream
        id: merge
        run: |
          set -euo pipefail
          git config user.name 'hexplus-sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "$UPSTREAM"
          git fetch -q --filter=blob:none upstream "$UPSTREAM_BRANCH"
          tip=$(git rev-parse HEAD)
          target=$(git rev-parse "upstream/$UPSTREAM_BRANCH")
          echo "upstream=$target" >> "$GITHUB_OUTPUT"
          blocked=$(gh pr list --head "$SYNC_BRANCH" --base hex-plus --state open --label conflict \
            --json number --jq '.[0].number // empty')
          if [[ -n "$blocked" ]]; then
            echo "Sync PR #$blocked still has conflicts to resolve; leaving it alone." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "status=blocked" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A local fix was pushed onto the open sync PR: rebuilding it would throw that work away.
          open_sync=$(gh pr list --head "$SYNC_BRANCH" --base hex-plus --state open \
            --json number --jq '.[0].number // empty')
          if [[ -n "$open_sync" ]] && git fetch -q origin "$SYNC_BRANCH" 2>/dev/null \
             && [[ "$(git log -1 --format=%an FETCH_HEAD)" != hexplus-sync ]]; then
            echo "Sync PR #$open_sync has local fixes on top; leaving it alone until it is promoted or closed." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "status=blocked" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git merge-base --is-ancestor "$target" HEAD; then
            echo "hex-plus already contains upstream ${target:0:8}." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "status=current" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base=$(git merge-base HEAD "$target")
          incoming=$(git rev-list --count "$base..$target")
          # Upstream must never reach Hex+'s own files.
          protected=$(git diff --name-only "$base" "$target" -- HEXPLUS.md .github/hexplus \
            '.github/workflows/hexplus-*' '.github/ISSUE_TEMPLATE/hexplus-*')
          if [[ -n "$protected" ]]; then
            { echo 'Upstream changes files Hex+ owns:'; echo "$protected"; } > "$RUNNER_TEMP/problem.txt"
            echo "status=protected" >> "$GITHUB_OUTPUT"; exit 1
          fi
          ios=$(git log --oneline "$base..$target" -- ios app/AppIcon.icon tests/fixtures/vocabulary/audio)
          ios_changed=$([[ -n "$ios" ]] && echo yes || echo no)
          title="Sync upstream anomalyco/hex dev @ ${target:0:8} ($incoming commits, iOS changed: $ios_changed)"
          git switch -q -C "$SYNC_BRANCH"
          conflicts=''
          if ! git merge --no-ff --no-edit -m "$title" "$target" > "$RUNNER_TEMP/merge.log" 2>&1; then
            conflicts=$(git diff --name-only --diff-filter=U)
            [[ -n "$conflicts" ]] || { cat "$RUNNER_TEMP/merge.log"; exit 1; }
            # Files listed in ours.txt: Hex+'s side wins, no agent needed.
            ours=$(grep -vE '^\s*(#|$)' .github/hexplus/ours.txt || true)
            remaining=''
            while read -r path; do
              [[ -n "$path" ]] || continue
              if grep -qxF "$path" <<<"$ours"; then
                if git cat-file -e "HEAD:$path" 2>/dev/null; then git checkout --ours -- "$path" && git add -- "$path"
                else git rm -q -- "$path"; fi
                echo "Kept Hex+'s version of $path" | tee -a "$GITHUB_STEP_SUMMARY"
              else
                remaining="${remaining:+$remaining$'\n'}$path"
              fi
            done <<<"$conflicts"
            conflicts=$remaining
            if [[ -z "$conflicts" ]]; then
              git commit -q --no-edit -m "$title"
            else
              # Keep the conflict markers in a commit, so an agent (or you) can fix them in the PR.
              git add -A
              git commit -q --no-edit -m "$title (CONFLICTS)" -m "Conflict markers left in:" -m "$conflicts"
            fi
          fi
          git push -q --force origin "HEAD:refs/heads/$SYNC_BRANCH"
          # Upstream PRs Hex+ carries early (branches upstream-pr/N): has upstream decided yet?
          carried=$(gh pr list --state all --label upstream-pr --limit 100 --json headRefName,state \
            --jq '.[] | select(.state != "CLOSED") | .headRefName' | sed -n 's#^upstream-pr/##p' | sort -un)
          {
            echo "Merges [anomalyco/hex@${target:0:8}](https://github.com/anomalyco/hex/commit/$target) into \`hex-plus\` (\`${tip:0:8}\`)."
            echo
            echo "- New upstream commits: **$incoming**"
            echo "- iOS changed upstream: **$ios_changed**"
            if [[ -n "$ios" ]]; then
              echo; echo 'Upstream commits touching the iPhone app:'; echo '```'; echo "$ios" | head -50; echo '```'
            fi
            echo
            if [[ -n "$conflicts" ]]; then
              echo; echo '> [!WARNING]'
              echo '> Merge conflicts are committed with markers. Resolve them locally on `sync/upstream`, push, then remove the `conflict` label and mark the PR ready; once tests and archive pass, the gate promotes the sync.'
              echo; echo '```'; echo "$conflicts"; echo '```'
            fi
            if [[ -n "$carried" ]]; then
              echo; echo 'Upstream PRs Hex+ carries early:'
              for n in $carried; do
                gh api "repos/anomalyco/hex/pulls/$n" --jq '"- anomalyco/hex#\(.number) \(.title): " + (if .merged_at then "**merged upstream** (now arrives through this sync)" elif .state == "closed" then "**closed upstream without merging**: decide whether Hex+ keeps it" else "still open upstream" end)' || echo "- anomalyco/hex#$n: unknown"
              done
            fi
            echo
            echo '_hexplus-gate fast-forwards `hex-plus` to this merge once Hex+ CI is green; then this PR shows as merged._'
          } > "$RUNNER_TEMP/body.md"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "conflict=$([[ -n "$conflicts" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "status=pushed" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the sync PR
        if: steps.merge.outputs.status == 'pushed'
        env:
          # Use the same trusted owner identity as the branch push, not the bot
          # that GitHub may classify as a first-time contributor needing approval.
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TITLE: ${{ steps.merge.outputs.title }}
          CONFLICT: ${{ steps.merge.outputs.conflict }}
        run: |
          pr_access_error() {
            echo '::error title=Sync PR access failed::Check SYNC_TOKEN in environment hexplus-sync: its fine-grained token needs Pull requests: Read and write for this repository, in addition to branch push access. See the GitHub error above for other possible causes.'
            exit 1
          }
          number=$(gh pr list --head "$SYNC_BRANCH" --base hex-plus --state open --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md" || pr_access_error
          else
            draft=(); [[ "$CONFLICT" == true ]] && draft=(--draft)
            gh pr create --head "$SYNC_BRANCH" --base hex-plus --title "$TITLE" \
              --body-file "$RUNNER_TEMP/body.md" --label sync "${draft[@]}" || pr_access_error
            number=$(gh pr list --head "$SYNC_BRANCH" --base hex-plus --state open --json number --jq '.[0].number')
          fi
          if [[ "$CONFLICT" == true ]]; then
            gh pr edit "$number" --add-label conflict
            gh pr comment "$number" --body 'This sync has merge conflicts (markers are committed). Resolve them locally on `sync/upstream` and push, then `gh pr edit <n> --remove-label conflict && gh pr ready <n>`; once tests and archive pass, the gate promotes the sync.'
          fi
      - name: Keep only Hex+ workflows enabled
        if: always()
        run: |
          gh workflow list --all --json id,path,state \
            --jq '.[] | select(.state == "active" and (.path | startswith(".github/workflows/hexplus-") | not)) | "\(.id) \(.path)"' |
          while read -r id path; do
            echo "Disabling upstream workflow $path"
            gh workflow disable "$id"
          done
      - name: Close a resolved sync issue
        if: success()
        run: |
          title='Hex+ sync needs you'
          for number in $(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number'); do
            gh issue close "$number" --comment 'Resolved: the sync succeeded again.'
          done
      - name: Report problem as an issue
        if: failure() && steps.merge.outputs.status == 'protected'
        env:
          STATUS: ${{ steps.merge.outputs.status }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Hex+ sync needs you'
          {
            echo "The daily sync could not merge upstream \`$UPSTREAM_SHA\` into \`hex-plus\` ($STATUS)."
            echo; echo '```'; cat "$RUNNER_TEMP/problem.txt"; echo '```'; echo
            echo "Run: $RUN_URL"
            echo; echo 'Upstream now touches files Hex+ owns. Rename or move the Hex+ file, then run the sync again (this issue closes itself).'
          } > "$RUNNER_TEMP/body.md"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
      # The status workflow has no schedule: the daily sync refreshes it, token check included.
      - name: Refresh the status issue
        if: always()
        run: gh workflow run hexplus-status.yml --ref hex-plus
