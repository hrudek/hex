# Hex+ (fork-only): keep hex-plus = anomalyco/hex dev + Hex+'s own commits.
# This job only runs git and gh; it never builds or runs repository code,
# because it holds SYNC_TOKEN (contents + workflows write on this fork only).
name: Hex+ sync upstream
run-name: "Hex+ sync · ${{ github.event_name }}"

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hexplus-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: hexplus-sync
    permissions:
      contents: read
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      # gh would otherwise pick the "upstream" remote (anomalyco/hex) as its repository.
      GH_REPO: ${{ github.repository }}
      UPSTREAM: https://github.com/anomalyco/hex.git
      UPSTREAM_BRANCH: dev
      BRANCH: hex-plus
    steps:
      - name: Require sync token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: test -n "$SYNC_TOKEN" || { echo 'Add secret SYNC_TOKEN to environment hexplus-sync'; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hex-plus
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Rebase hex-plus onto upstream
        id: rebase
        run: |
          set -euo pipefail
          git config user.name 'hexplus-sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "$UPSTREAM"
          git fetch -q --filter=blob:none upstream "$UPSTREAM_BRANCH"
          old=$(git rev-parse HEAD)
          base=$(git merge-base HEAD "upstream/$UPSTREAM_BRANCH")
          new_upstream=$(git rev-parse "upstream/$UPSTREAM_BRANCH")
          ours=$(git rev-list --count "$base..HEAD")
          incoming=$(git rev-list --count "$base..$new_upstream")
          {
            echo "old=$old"; echo "upstream=$new_upstream"; echo "incoming=$incoming"; echo "ours=$ours"
          } >> "$GITHUB_OUTPUT"
          if [[ "$incoming" == 0 ]]; then
            echo "Up to date with upstream ($new_upstream)." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "status=current" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Upstream must never reach Hex+'s build and signing scripts.
          protected=$(git diff --name-only "$base" "$new_upstream" -- .github/hexplus HEXPLUS.md \
            '.github/workflows/hexplus-*')
          if [[ -n "$protected" ]]; then
            { echo 'Upstream changes files Hex+ owns:'; echo "$protected"; } > "$RUNNER_TEMP/problem.txt"
            echo "status=protected" >> "$GITHUB_OUTPUT"; exit 1
          fi
          if ! git rebase "upstream/$UPSTREAM_BRANCH" > "$RUNNER_TEMP/rebase.log" 2>&1; then
            {
              echo 'Rebase conflict while applying:'
              git log -1 --format='%h %s' REBASE_HEAD 2>/dev/null || true
              echo; echo 'Conflicting files:'
              git diff --name-only --diff-filter=U
            } > "$RUNNER_TEMP/problem.txt"
            git rebase --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"; exit 1
          fi
          git push --force-with-lease="$BRANCH:$old" origin "HEAD:$BRANCH"
          echo "status=synced" >> "$GITHUB_OUTPUT"
          {
            echo '### Hex+ sync'
            echo "| | |"; echo "|---|---|"
            echo "| Upstream | \`$new_upstream\` |"
            echo "| New upstream commits | $incoming |"
            echo "| Hex+ commits replayed | $ours |"
            echo "| hex-plus | \`$old\` → \`$(git rev-parse HEAD)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep only Hex+ workflows enabled
        if: always()
        run: |
          gh workflow list --all --json id,path,state \
            --jq '.[] | select(.state == "active" and (.path | startswith(".github/workflows/hexplus-") | not)) | "\(.id) \(.path)"' |
          while read -r id path; do
            echo "Disabling upstream workflow $path"
            gh workflow disable "$id"
          done
      - name: Close a resolved sync issue
        if: success()
        run: |
          title='Hex+ sync needs you'
          for number in $(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number'); do
            gh issue close "$number" --comment 'Resolved: the sync succeeded again.'
          done
      - name: Report problem as an issue
        if: failure() && (steps.rebase.outputs.status == 'conflict' || steps.rebase.outputs.status == 'protected')
        env:
          STATUS: ${{ steps.rebase.outputs.status }}
          UPSTREAM_SHA: ${{ steps.rebase.outputs.upstream }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Hex+ sync needs you'
          {
            echo "The daily sync could not rebase \`hex-plus\` onto upstream \`$UPSTREAM_SHA\` ($STATUS)."
            echo; echo '```'; cat "$RUNNER_TEMP/problem.txt"; echo '```'; echo
            echo "Run: $RUN_URL"
            echo; echo 'Resolve locally (this issue closes itself after the next successful sync):'
            echo '```sh'
            echo 'git fetch origin && git fetch upstream && git switch hex-plus && git merge --ff-only origin/hex-plus'
            echo 'git rebase upstream/dev   # fix conflicts, git rebase --continue'
            echo 'git push --force-with-lease'
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
