# Hex+ (fork-only): Claude plans and builds features, on the owner's request only.
#   plan  (Linux, Opus):    labelling an issue "agent" (also at creation), or a comment
#                           containing "@claude plan". Questions and a written plan in the
#                           issue; it cannot edit files or commit.
#   build (macOS, Sonnet):  any other "@claude" comment on an issue or PR. Implements the
#                           agreed plan, runs the simulator tests, pushes to
#                           feature/<n>-<title>. On a PR it pushes to that PR's branch.
#   open-pr (Linux, SYNC_TOKEN, git/gh only): opens the PR for a new feature/<n>-* branch
#                           with auto-merge, so it lands on hex-plus once it compiles.
#   Red CI afterwards is repaired by hexplus-fix.
#   Label "model:opus" on the issue/PR makes build use Opus too.
# Uses the owner's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN from
# `claude setup-token`) in the environment hexplus-agent; no signing secrets.
name: Hex+ agent
run-name: "Hex+ agent · #${{ github.event.issue.number }} · ${{ github.event_name == 'issues' && 'plan' || 'comment' }}"

on:
  issues:
    # "labeled" also fires when an issue is created with the label.
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: hexplus-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  plan:
    # Only the owner, only when asked. The public repo lets anyone comment.
    if: >-
      github.actor == 'hrudek' && (
        (github.event_name == 'issues' && github.event.label.name == 'agent')
        || (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude plan')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: hexplus-agent
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: agent
          trigger_phrase: "@claude"
          base_branch: hex-plus
          branch_prefix: feature/
          branch_name_template: "{{prefix}}{{entityNumber}}-{{description}}"
          # The owner's comments and Claude's own (its questions and plans); nobody else's.
          include_comments_by_actor: hrudek,claude[bot]
          claude_args: |
            --model opus
            --max-turns 40
            --allowedTools "Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git status:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,Bash(git add:*),Bash(git commit:*),Bash(git rm:*)"
            --append-system-prompt "You are the PLANNING step for Hex+, a personal fork of anomalyco/hex that only ships the iPhone app. Read HEXPLUS.md and the relevant code in ios/, then reply in your issue comment and stop: you cannot and must not change files, commit or push. The owner does not read code and skims long text, so split the reply in two. PART 1, for the owner, at most 12 lines, plain language, no file names or code: one sentence on what changes for the user; at most 3 bullets 'What you will see', including the Hex+ switch name (on by default) if the feature gets one; at most 3 numbered questions, one line each with your suggested default in bold, and only about things the owner would notice (look, behaviour, scope); decide everything technical yourself; if nothing needs asking, write 'No questions.'; then the line: Reply '@claude go' to build this (add corrections if you like), or '@claude plan …' to change the plan. PART 2, for the build agent, inside <details><summary>Technical plan for the build agent</summary> … </details> so it stays collapsed: the complete plan a separate, cheaper model follows without asking again: behaviour per state, the Hex+ switch if any (key, default true, in the app's Hex+ section per HEXPLUS.md; none for bug fixes), files to change and the approach per file, simulator tests to add in ios/HEXMobileTests and the agent-test.sh command, the HEXPLUS.md feature-table row, and what only a real iPhone can prove. Do not leave a progress checklist in the final comment. The plan must respect these Rules: change only ios/ and HEXPLUS.md (never .github/ unless the issue explicitly asks for it), never edit upstream's identity (com.kitlangton.hex.mobile, team QC99C9JE59) because CI rewrites it, follow HEXPLUS.md's switch rules (new behaviour gets a Hex+ switch that is ON by default in Hex+'s own files; bug fixes get none; off keeps today's behaviour), add simulator tests in ios/HEXMobileTests, and update the feature table in HEXPLUS.md. Fast lane: write simulator tests, but hand over the change promptly so PR CI can build the device archive and run tests in parallel. A successful local simulator run is not required before handover; use `bash .github/hexplus/agent-test.sh` with targeted tests when useful for debugging, or when the owner explicitly asks you to fix test failures before proceeding. Do not claim unrun tests passed; say which tests ran, which are left to CI, any known failures, and what only a real iPhone can prove. When resolving merge-conflict markers, keep both sides' intent: upstream's change plus Hex+'s feature, and remove every marker. Prefill the pull request title as a short user-facing summary and its body with: what changes for the user, files, tests run, untested on device, a line 'Screenshots: <comma-separated --snap-state scenes your change affects>', and 'Closes #<issue>'."

      - name: Show Claude's error (only the final result, not the conversation)
        if: failure() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '.[] | select(.type == "result") | "subtype=\(.subtype) is_error=\(.is_error) turns=\(.num_turns)\n\(.result // "(no result text)")"' "$EXECUTION_FILE" | head -40 \
            | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    if: >-
      github.actor == 'hrudek' && github.event_name == 'issue_comment'
      && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude plan')
    runs-on: ${{ vars.MACOS_BUILD_RUNNER || 'macos-15-intel' }}
    timeout-minutes: 120
    environment: hexplus-agent
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Prepare Xcode and XcodeGen for the agent
        run: |
          echo '.hexplus-*.md' >> .git/info/exclude   # the agent's notes, never committed
          bash .github/hexplus/select-xcode.sh
          command -v xcodegen >/dev/null || brew install xcodegen
      - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: agent
          trigger_phrase: "@claude"
          base_branch: hex-plus
          branch_prefix: feature/
          branch_name_template: "{{prefix}}{{entityNumber}}-{{description}}"
          # The owner's comments and Claude's own (its questions); nobody else's.
          include_comments_by_actor: hrudek,claude[bot]
          additional_permissions: |
            actions: read
          claude_args: |
            --model ${{ contains(github.event.issue.labels.*.name, 'model:opus') && 'opus' || 'sonnet' }}
            --max-turns 80
            --allowedTools "Bash(bash .github/hexplus/agent-test.sh:*),Bash(xcodegen:*),Bash(xcodebuild:*),Bash(xcrun simctl list:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git status:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh run view:*),Bash(gh run list:*)"
            --append-system-prompt "You are the BUILD step for Hex+, a personal fork of anomalyco/hex that only ships the iPhone app. If the issue has a plan from an earlier Claude comment (the collapsed 'Technical plan for the build agent' section) and the owner approved it, implement exactly that plan plus the owner's answers and corrections, without re-planning. Keep your final reply short for the owner (what was built, how to try it, what to check on the iPhone) and put technical detail in a collapsed <details> block. Without a plan, read HEXPLUS.md first; if something unclear would change what the user sees or how the app behaves, ask short numbered questions with suggested defaults and stop without pushing. Decide smaller details yourself and list those assumptions in the PR body. Rules: change only ios/ and HEXPLUS.md (never .github/ unless the issue explicitly asks for it), never edit upstream's identity (com.kitlangton.hex.mobile, team QC99C9JE59) because CI rewrites it, follow HEXPLUS.md's switch rules (new behaviour gets a Hex+ switch that is ON by default in Hex+'s own files; bug fixes get none; off keeps today's behaviour), add simulator tests in ios/HEXMobileTests, and update the feature table in HEXPLUS.md. Fast lane: write simulator tests, but hand over the change promptly so PR CI can build the device archive and run tests in parallel. A successful local simulator run is not required before handover; use `bash .github/hexplus/agent-test.sh` with targeted tests when useful for debugging, or when the owner explicitly asks you to fix test failures before proceeding. Do not claim unrun tests passed; say which tests ran, which are left to CI, any known failures, and what only a real iPhone can prove. When resolving merge-conflict markers, keep both sides' intent: upstream's change plus Hex+'s feature, and remove every marker. The pull request opens itself and merges once it compiles; do not post a 'Create PR' link. Write its text to the file .hexplus-pr.md in the repository root (never commit it): line 1 a short user-facing title, then the body with: what changes for the user, files, tests run, untested on device, a line 'Screenshots: <comma-separated --snap-state scenes your change affects>', and 'Closes #<issue>'."
      - name: Keep the PR text for open-pr
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hexplus-pr-text-${{ github.run_id }}
          path: .hexplus-pr.md
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
      - name: Show Claude's error (only the final result, not the conversation)
        if: failure() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '.[] | select(.type == "result") | "subtype=\(.subtype) is_error=\(.is_error) turns=\(.num_turns)\n\(.result // "(no result text)")"' "$EXECUTION_FILE" | head -40 \
            | tee -a "$GITHUB_STEP_SUMMARY"

  open-pr:
    needs: build
    # Issues only; on a PR the build pushed to the PR's own branch.
    if: success() && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: hexplus-sync
    permissions:
      contents: read
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: hexplus-pr-text-${{ github.run_id }}
          path: pr-text
      - name: Open the PR with auto-merge (as the owner, so CI runs without approval)
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          branch=$(gh api "repos/$GH_REPO/branches" --paginate --jq '.[].name' | grep -E "^feature/$ISSUE-" | head -1 || true)
          if [[ -z "$branch" ]]; then echo 'No feature branch pushed (the agent asked questions or stopped).'; exit 0; fi
          if [[ -n "$(gh pr list --head "$branch" --state all --json number --jq '.[0].number // empty')" ]]; then
            echo "$branch already has a PR."; exit 0
          fi
          if [[ "$(gh api "repos/$GH_REPO/compare/hex-plus...$branch" --jq .ahead_by)" == 0 ]]; then
            echo "$branch has no new commits."; exit 0
          fi
          if [[ -s pr-text/.hexplus-pr.md ]]; then
            title=$(head -1 pr-text/.hexplus-pr.md | sed 's/^#* *//' | cut -c1-100)
            tail -n +2 pr-text/.hexplus-pr.md > body.md
          else
            title=$ISSUE_TITLE
            : > body.md
          fi
          grep -q "#$ISSUE" body.md || printf '\nCloses #%s\n' "$ISSUE" >> body.md
          gh pr create --head "$branch" --base hex-plus --title "${title:-$ISSUE_TITLE}" --body-file body.md --label feature
          gh pr merge "$branch" --auto --squash
