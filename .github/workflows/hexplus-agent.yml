# Hex+ (fork-only): Claude plans and builds features, on the owner's request only.
#   plan  (Linux, Opus):    labelling an issue "agent" (also at creation), or a comment
#                           containing "@claude plan". Questions and a written plan in the
#                           issue; it cannot edit files or commit.
#   build (macOS, Sonnet):  any other "@claude" comment on an issue or PR. Implements the
#                           agreed plan, runs the simulator tests, pushes to
#                           feature/<n>-<title> and leaves a "Create PR" link (Claude never
#                           opens PRs itself; opening it starts Hex+ CI). On a PR it pushes
#                           fixes to that PR's branch, also for merge-conflict markers.
#   Label "model:opus" on the issue/PR makes build use Opus too.
# Uses the owner's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN from
# `claude setup-token`) in the environment hexplus-agent; no signing secrets.
name: Hex+ agent
run-name: "Hex+ agent · #${{ github.event.issue.number }} · ${{ github.event_name == 'issues' && 'plan' || 'comment' }}"

on:
  issues:
    # "labeled" also fires when an issue is created with the label.
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: hexplus-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  plan:
    # Only the owner, only when asked. The public repo lets anyone comment.
    if: >-
      github.actor == 'hrudek' && (
        (github.event_name == 'issues' && github.event.label.name == 'agent')
        || (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude plan')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: hexplus-agent
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: agent
          trigger_phrase: "@claude"
          base_branch: hex-plus
          branch_prefix: feature/
          branch_name_template: "{{prefix}}{{entityNumber}}-{{description}}"
          # The owner's comments and Claude's own (its questions and plans); nobody else's.
          include_comments_by_actor: hrudek,claude[bot]
          claude_args: |
            --model opus
            --max-turns 40
            --allowedTools "Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git status:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,Bash(git add:*),Bash(git commit:*),Bash(git rm:*)"
            --append-system-prompt "You are the PLANNING step for Hex+, a personal fork of anomalyco/hex that only ships the iPhone app. Read HEXPLUS.md and the relevant code in ios/, then reply in your issue comment and stop: you cannot and must not change files, commit or push. The owner does not read code and skims long text, so split the reply in two. PART 1, for the owner, at most 12 lines, plain language, no file names or code: one sentence on what changes for the user; at most 3 bullets 'What you will see', including the experiment switch name (off by default); at most 3 numbered questions, one line each with your suggested default in bold, and only about things the owner would notice (look, behaviour, scope); decide everything technical yourself; if nothing needs asking, write 'No questions.'; then the line: Reply '@claude go' to build this (add corrections if you like), or '@claude plan …' to change the plan. PART 2, for the build agent, inside <details><summary>Technical plan for the build agent</summary> … </details> so it stays collapsed: the complete plan a separate, cheaper model follows without asking again: behaviour per state, experiment switch (key, default false, where it appears), files to change and the approach per file, simulator tests to add in ios/HEXMobileTests and the agent-test.sh command, the HEXPLUS.md feature-table row, and what only a real iPhone can prove. Do not leave a progress checklist in the final comment. The plan must respect these Rules: change only ios/ and HEXPLUS.md (never .github/ unless the issue explicitly asks for it), never edit upstream's identity (com.kitlangton.hex.mobile, team QC99C9JE59) because CI rewrites it, put new behaviour behind an experiment switch that is off by default as upstream's ios/README.md describes, add simulator tests in ios/HEXMobileTests, and update the feature table in HEXPLUS.md. Before pushing, run `bash .github/hexplus/agent-test.sh` (optionally with a comma-separated -only-testing list) and fix failures; say in your reply which tests ran and what only a real iPhone can prove. When resolving merge-conflict markers, keep both sides' intent: upstream's change plus Hex+'s feature, and remove every marker. Prefill the pull request title as a short user-facing summary and its body with: what changes for the user, files, tests run, untested on device, and 'Closes #<issue>'."

      - name: Show Claude's error (only the final result, not the conversation)
        if: failure() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '.[] | select(.type == "result") | "subtype=\(.subtype) is_error=\(.is_error) turns=\(.num_turns)\n\(.result // "(no result text)")"' "$EXECUTION_FILE" | head -40 \
            | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    if: >-
      github.actor == 'hrudek' && github.event_name == 'issue_comment'
      && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude plan')
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 120
    environment: hexplus-agent
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Prepare Xcode and XcodeGen for the agent
        run: |
          bash .github/hexplus/select-xcode.sh
          command -v xcodegen >/dev/null || brew install xcodegen
      - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: agent
          trigger_phrase: "@claude"
          base_branch: hex-plus
          branch_prefix: feature/
          branch_name_template: "{{prefix}}{{entityNumber}}-{{description}}"
          # The owner's comments and Claude's own (its questions); nobody else's.
          include_comments_by_actor: hrudek,claude[bot]
          additional_permissions: |
            actions: read
          claude_args: |
            --model ${{ contains(github.event.issue.labels.*.name, 'model:opus') && 'opus' || 'sonnet' }}
            --max-turns 80
            --allowedTools "Bash(bash .github/hexplus/agent-test.sh:*),Bash(xcodegen:*),Bash(xcodebuild:*),Bash(xcrun simctl list:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git status:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh run view:*),Bash(gh run list:*)"
            --append-system-prompt "You are the BUILD step for Hex+, a personal fork of anomalyco/hex that only ships the iPhone app. If the issue has a plan from an earlier Claude comment (the collapsed 'Technical plan for the build agent' section) and the owner approved it, implement exactly that plan plus the owner's answers and corrections, without re-planning. Keep your final reply short for the owner (what was built, how to try it, what to check on the iPhone) and put technical detail in a collapsed <details> block. Without a plan, read HEXPLUS.md first; if something unclear would change what the user sees or how the app behaves, ask short numbered questions with suggested defaults and stop without pushing. Decide smaller details yourself and list those assumptions in the PR body. Rules: change only ios/ and HEXPLUS.md (never .github/ unless the issue explicitly asks for it), never edit upstream's identity (com.kitlangton.hex.mobile, team QC99C9JE59) because CI rewrites it, put new behaviour behind an experiment switch that is off by default as upstream's ios/README.md describes, add simulator tests in ios/HEXMobileTests, and update the feature table in HEXPLUS.md. Before pushing, run `bash .github/hexplus/agent-test.sh` (optionally with a comma-separated -only-testing list) and fix failures; say in your reply which tests ran and what only a real iPhone can prove. When resolving merge-conflict markers, keep both sides' intent: upstream's change plus Hex+'s feature, and remove every marker. Prefill the pull request title as a short user-facing summary and its body with: what changes for the user, files, tests run, untested on device, and 'Closes #<issue>'."
      - name: Show Claude's error (only the final result, not the conversation)
        if: failure() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '.[] | select(.type == "result") | "subtype=\(.subtype) is_error=\(.is_error) turns=\(.num_turns)\n\(.result // "(no result text)")"' "$EXECUTION_FILE" | head -40 \
            | tee -a "$GITHUB_STEP_SUMMARY"
