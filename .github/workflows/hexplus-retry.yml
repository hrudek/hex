# Recover only GitHub-hosted macOS allocation failures, not code/test failures.
# Wildcards avoid the '+' pattern issue; never subscribe to this workflow itself.
name: Hex+ runner retry
run-name: "Hex+ runner retry · ${{ github.event.workflow_run.head_branch }} · attempt ${{ github.event.workflow_run.run_attempt }}"

on:
  workflow_run:
    workflows: ["Hex* CI", "Hex* PR to iPhone", "Hex* fix"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: hexplus-runner-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.repository.full_name == github.repository
      && github.event.workflow_run.head_repository.full_name == github.repository
      && (github.event.workflow_run.path == '.github/workflows/hexplus-ci.yml'
          || github.event.workflow_run.path == '.github/workflows/hexplus-ad-hoc.yml'
          || github.event.workflow_run.path == '.github/workflows/hexplus-fix.yml')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
      pull-requests: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hex-plus
          sparse-checkout: .github/hexplus
          persist-credentials: false
      - name: Retry only an unallocated macOS job (5, 10, 20 minute backoff)
        run: python3 -I .github/hexplus/retry-capacity.py
