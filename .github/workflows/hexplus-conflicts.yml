# Trusted coordinator only: never execute PR code, never give the resolver SYNC_TOKEN.
# Event-driven, no schedule. Conflicts appear only when hex-plus moves (push) or a
# Hex+ PR is opened/updated; sync, upstream-pr and fix push and open PRs with
# SYNC_TOKEN, so their branches arrive here as pull_request_target events.
name: Hex+ automatic conflicts

on:
  pull_request_target:
    branches: [hex-plus]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [hex-plus]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hexplus-automatic-conflicts
  cancel-in-progress: false

jobs:
  detect:
    # PR events only for branches conflicts.py handles; a label only when it is "conflict".
    if: >-
      github.event_name != 'pull_request_target'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && (github.event.pull_request.head.ref == 'sync/upstream'
              || startsWith(github.event.pull_request.head.ref, 'feature/')
              || startsWith(github.event.pull_request.head.ref, 'upstream-pr/')
              || startsWith(github.event.pull_request.head.ref, 'fix/ci-'))
          && (github.event.action != 'labeled' || github.event.label.name == 'conflict'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: hexplus-sync
    permissions:
      contents: write
      actions: write
      issues: write
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hex-plus
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Prepare conflicted PR branches and request the Linux resolver
        # Load the trusted script before checking out any PR. It only calls git/gh.
        run: python3 -I .github/hexplus/conflicts.py
