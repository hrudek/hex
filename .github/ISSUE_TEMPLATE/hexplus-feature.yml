# Hex+ (fork-only). A note for later work; no agent starts from issues.
name: Hex+ feature
description: Note what should change in the iPhone app, to be built later in a local session.
body:
  - type: textarea
    id: what
    attributes:
      label: What should change?
      description: From the user's point of view, one or two sentences are enough.
      placeholder: "While dictating, the keyboard should …"
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example or reference (optional)
      description: Another app, a screenshot, or a situation where it bothers you.
