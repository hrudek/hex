# Hex+ (fork-only). Creating an issue with this form labels it "agent", which
# starts the planning agent (owner only; anyone else's issue starts nothing).
name: Feature für Hex+
description: Beschreib, was sich in der iPhone-App ändern soll. Claude stellt Rückfragen und schreibt einen Plan.
labels: [agent]
body:
  - type: textarea
    id: what
    attributes:
      label: Was soll sich ändern?
      description: Aus Sicht der Nutzung, gern in ein, zwei Sätzen.
      placeholder: "Die Tastatur soll beim Diktieren …"
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Beispiel / Vorbild (optional)
      description: Eine andere App, ein Screenshot, eine Situation, in der es dich stört.
