# Hex+ (fork-only). Creating an issue with this form labels it "agent", which
# starts the planning agent (owner only; anyone else's issue starts nothing).
name: Hex+ feature
description: Describe what should change in the iPhone app. Claude asks questions and writes a plan.
labels: [agent]
body:
  - type: textarea
    id: what
    attributes:
      label: What should change?
      description: From the user's point of view, one or two sentences are enough.
      placeholder: "While dictating, the keyboard should …"
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example or reference (optional)
      description: Another app, a screenshot, or a situation where it bothers you.
