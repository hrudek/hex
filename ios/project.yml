name: Typr
options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: dev.rudek.typr
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "2660"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.15.5
settings:
  base:
    DEVELOPMENT_TEAM: 2ZNGF24932
    SWIFT_VERSION: 6.0
targets:
  Typr:
    type: application
    platform: iOS
    sources:
      - Typr
      - TyprShared
      - TyprActivity
      - Branding/TyprWordmark.swift
      - path: AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: FluidAudio
      - target: TyprKeyboard
        embed: true
      - target: TyprWidgets
        embed: true
    info:
      path: Typr/Info.plist
      properties:
        CFBundleDisplayName: Typr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: dev.rudek.typr.keyboard-session
            CFBundleURLSchemes:
              - typr
        NSMicrophoneUsageDescription: Typr records only while you dictate and transcribes locally on this iPhone.
        NSSpeechRecognitionUsageDescription: Typr uses Apple's on-device SpeechTranscriber to turn your recording into text.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Typr/Typr.entitlements
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.2.0
        OTHER_LDFLAGS: $(inherited) -weak_framework FoundationModels
        OTHER_SWIFT_FLAGS: $(inherited) -Xfrontend -disable-autolink-framework -Xfrontend FoundationModels
        PRODUCT_BUNDLE_IDENTIFIER: dev.rudek.typr
        PRODUCT_NAME: Typr
    scheme:
      gatherCoverageData: false
      testTargets:
        - TyprTests
  TyprKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - TyprKeyboard
      - TyprShared
      - Branding/TyprWordmark.swift
    info:
      path: TyprKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Typr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: TyprKeyboard/TyprKeyboard.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.2.0
        PRODUCT_BUNDLE_IDENTIFIER: dev.rudek.typr.keyboard
        PRODUCT_NAME: TyprKeyboard
        SKIP_INSTALL: YES
  TyprWidgets:
    type: app-extension
    platform: iOS
    sources:
      - TyprWidgets
      - TyprActivity
      - TyprShared/TyprTheme.swift
      - Branding/TyprWordmark.swift
    info:
      path: TyprWidgets/Info.plist
      properties:
        CFBundleDisplayName: Typr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.2.0
        PRODUCT_BUNDLE_IDENTIFIER: dev.rudek.typr.widgets
        PRODUCT_NAME: TyprWidgets
        SKIP_INSTALL: YES
  TyprTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TyprTests
      - path: TestFixtures/term-hex-1.wav
        buildPhase: resources
    dependencies:
      - target: Typr
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.rudek.typr.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Typr.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Typr
